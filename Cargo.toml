[package]
name = "medtill"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = "0.35.0"
egui = "0.35.0"
nokhwa = { version = "0.10.11", features = ["input-native"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rxing = "0.9.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.dev.package."*"]
opt-level = 3
